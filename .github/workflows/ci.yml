name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    # The image every deploy example builds: it must build, start and answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hushlist:ci --build-arg RELEASE=${GITHUB_SHA::12} .
      - run: |
          mkdir data && sudo chown 1000:1000 data
          docker run -d --name app -p 3000:3000 -v "$PWD/data:/data" -e HUSHLIST_LINK_CHECK=off hushlist:ci
          for i in $(seq 30); do curl -fsS localhost:3000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
