# Hushlist on Tailscale Funnel: a public https://<name>.<tailnet>.ts.net
# address without a domain of your own and without opening a port in the
# router. README.md in this directory walks through it.
#
#   cp .env.example .env      # then fill it in
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d --build
#
# The same shape as the Cloudflare example, with Tailscale as the way in:
#   inside   internal: no route anywhere. The app lives only here.
#   outside  the internet. Only the proxy out and Tailscale are on it.
# Tailscale terminates HTTPS and proxies to http://hushlist:3000
# (tailscale/serve.json). Funnel is OFF in that file until the first setup is
# done — README.md, step 4.

services:
  hushlist:
    build: ../..
    image: hushlist:local
    container_name: hushlist
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      TZ: ${HUSHLIST_TIMEZONE:-Europe/Copenhagen}
      HUSHLIST_TIMEZONE: ${HUSHLIST_TIMEZONE:-Europe/Copenhagen}
      HUSHLIST_PUBLIC_URL: ${HUSHLIST_PUBLIC_URL:-}
      HUSHLIST_LANGUAGE: ${HUSHLIST_LANGUAGE:-}
      HUSHLIST_LINK_CHECK: ${HUSHLIST_LINK_CHECK:-on}
      HUSHLIST_EGRESS_PROXY: http://hushlist-egress:3128
    volumes:
      - ${HUSHLIST_DATA:-./data}:/data
    networks: [inside]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  hushlist-egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    container_name: hushlist-egress
    restart: unless-stopped
    user: "13:13"
    entrypoint: ["squid", "-N", "-f", "/etc/squid/hushlist.conf"]
    volumes:
      - ../squid.conf:/etc/squid/hushlist.conf:ro
    networks: [inside, outside]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 64

  hushlist-tailscale:
    # Pin a version (tailscale/tailscale:v1.xx.y) once it works for you.
    image: tailscale/tailscale:stable
    container_name: hushlist-tailscale
    hostname: ${TS_HOSTNAME:-wishes}
    restart: unless-stopped
    environment:
      # An auth key from the admin console (README.md). A secret: .env only.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-wishes}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking: no /dev/net/tun and no NET_ADMIN needed. Serve
      # and Funnel proxy to the app over the Docker network either way.
      TS_USERSPACE: "true"
      # A directory, not the file: Tailscale only notices edits that way.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on: [hushlist]
    networks: [inside, outside]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

networks:
  inside:
    internal: true
  outside: {}
