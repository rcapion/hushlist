name: release

# A tag v<semver> builds the image for amd64 and arm64, pushes it to
# ghcr.io/<owner>/hushlist with the version, the minor and `latest`, and makes
# a GitHub Release with that version's section of CHANGELOG.md.
#
#   git tag -a v0.1.0 -m "Hushlist 0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image on ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag but package.json says $pkg"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hushlist
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: RELEASE=${{ github.ref_name }}

      - name: The image starts and answers
        run: |
          image="ghcr.io/${{ github.repository_owner }}/hushlist:${GITHUB_REF_NAME#v}"
          mkdir data && sudo chown 1000:1000 data
          docker run -d --name app -p 3000:3000 -v "$PWD/data:/data" -e HUSHLIST_LINK_CHECK=off "$image"
          for i in $(seq 30); do curl -fsS localhost:3000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1

      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no section '## $version' in CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "Hushlist $version" --notes-file notes.md
