# The app's one door out (deploy/*/compose.yaml, service hushlist-egress).
# The app fetches shop pages and pictures for the wishes people paste; this
# proxy makes sure that is ALL it can reach. It refuses every private,
# loopback, link-local, CGNAT/tailnet and multicast address — checked against
# the address it actually connects to, so DNS tricks do not help — and every
# port but 80/443 (CONNECT only to 443). No cache, no access log.
#
# The app has its own guard against the same addresses (src/lib/ssrf.ts); this
# is the second one, outside the process.
http_port 3128
visible_hostname hushlist-egress
pinger_enable off
cache_mem 8 MB
acl house dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 fec0::/10 ff00::/8
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT
http_access deny house
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access allow all
cache deny all
access_log none
cache_log /tmp/cache.log
pid_filename /tmp/squid.pid
coredump_dir /tmp
netdb_filename none
logfile_rotate 0
forwarded_for delete
via off
