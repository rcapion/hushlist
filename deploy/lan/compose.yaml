# Hushlist with nothing in front: one container, one port. For trying it on
# the LAN, or behind a reverse proxy you already run (Caddy, Traefik, Nginx
# Proxy Manager, a NAS's own) — see docs/HOSTING.md for what that proxy must do.
#
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d --build
#   open http://<this machine>:3000
#
# Plain http is fine on the LAN for a test. The family should get https.
# Without the egress proxy of the other examples the app reaches the internet
# directly; its own guard still refuses private addresses (src/lib/ssrf.ts).

services:
  hushlist:
    build: ../..
    image: hushlist:local
    container_name: hushlist
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${HUSHLIST_PORT:-3000}:3000"
    environment:
      TZ: ${HUSHLIST_TIMEZONE:-Europe/Copenhagen}
      HUSHLIST_TIMEZONE: ${HUSHLIST_TIMEZONE:-Europe/Copenhagen}
      HUSHLIST_PUBLIC_URL: ${HUSHLIST_PUBLIC_URL:-}
      HUSHLIST_LANGUAGE: ${HUSHLIST_LANGUAGE:-}
      HUSHLIST_LINK_CHECK: ${HUSHLIST_LINK_CHECK:-on}
    volumes:
      - ${HUSHLIST_DATA:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
